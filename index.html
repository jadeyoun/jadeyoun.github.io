<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wrap">
      <!--header start-->
      <header>
        <h1><a href="#">youn</a></h1>
        <ul class="nav">
          <li><a href="#">profile</a></li>
          <li><a href="#">portfolio</a></li>
          <li><a href="#">contact</a></li>
        </ul>
      </header>
      <!--header end-->

      <!--main start-->
      <main>
        <h2>안녕하세요</h2>

        <!--video-box start-->
        <div class="video-box">
          <video autoplay loop muted playsinline>
            <source src="img/IMG_1625.mp4" type="video/mp4" />
            <p>브라우저에서 비디오를 지원하지 않습니다.</p>
          </video>
        </div>
        <!--video-box end-->

        <!--profile-box start-->
        <div class="profile-box">
          <div id="card">
            <p class="sub title">BAMGGUI'S WISDOM</p>
            <img src="img/bamggui.jpg" alt="프로필 이미지" />
            <h1>BAMGGUI</h1>
            <p class="text">
              "We are not spoiled. We are properly worshipped."
            </p>
            <p class="tagline">Eat. Sleep. Be adored. Repeat.</p>
            <a href="http://google.com" target="_blank">FEED ME!</a>
          </div>
        </div>
        <!--profile-box end-->

        <div class="portfolio-box">
          <ul class="photo-list">
            <li>
              <a href="#modal1"
                ><img src="img/img_photo_1.jpg" alt="이미지1"
              /></a>
            </li>
            <li>
              <a href="#modal2"
                ><img src="img/img_photo_2.jpg" alt="이미지1"
              /></a>
            </li>
            <li>
              <a href="#modal3"
                ><img src="img/img_photo_3.jpg" alt="이미지1"
              /></a>
            </li>
          </ul>

          <div id="modal1" class="modal">
            <div class="modal-content">
              <a href="#" class="close-btn">&times;</a>
              <img src="img/img_photo_1.jpg" alt="이미지1" />
            </div>
          </div>
          <div id="modal2" class="modal">
            <div class="modal-content">
              <a href="#" class="close-btn">&times;</a>
              <img src="img/img_photo_2.jpg" alt="이미지1" />
            </div>
          </div>
          <div id="modal3" class="modal">
            <div class="modal-content">
              <a href="#" class="close-btn">&times;</a>
              <img src="img/img_photo_3.jpg" alt="이미지1" />
            </div>
          </div>
        </div>
        <!--portfolio-box end-->

        <!--slide-box start-->
        <div class="slide-box">
          <ul>
            <li><img src="img/img_album.jpg" alt="이미지1" /></li>
            <li><img src="img/img_album2.jpg" alt="이미지1" /></li>
            <li><img src="img/img_album3.jpg" alt="이미지1" /></li>
          </ul>
        </div>
        <!--slide-box end-->
      </main>
      <!--main end-->

      <!--footer start-->
      <footer>
        <p>&copy;jade.younp 2026.</p>
        <ul>
          <li><a href="#">insta</a></li>
          <li><a href="#">bahance</a></li>
        </ul>
      </footer>
      <!--footer end-->
    </div>
  </body>
</html>
